name: Generate and Publish repo statistics

on:
  schedule:
    - cron: "0 0 * * 0" # Running night to sunday at 00:00 UTC
  workflow_dispatch: # For running manually

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install poetry
        run: pipx install poetry==2.3.4

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run script
        run: poetry run python3 template_repos.py ${{ secrets.SSB_READ_TOKEN }}

      - name: Move content to publish folder
        run: |
          mkdir _site
          mv pypitemplate-repos.html _site/
          mv stat-repos.html _site/
          mv index.html _site/

      - name: Upload GitHub Pages artifacts
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: generate-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
